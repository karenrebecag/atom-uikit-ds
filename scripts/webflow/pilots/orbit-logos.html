<!--
  F7 pilot — matches orbit-logos.ts DOM contract.
  Selectores por atributo: identico en el canal Webflow y en el de codigo.

  El boton lleva la pintura de .marquee__toggle (mismo control, mismo icono por
  aria-pressed) y data-orbit-toggle como hook. Va DENTRO de la raiz: el puntero
  o el foco sobre el pausan la orbita igual que sobre los logos.

  data-orbit-label es el nombre que aparece en hover; el alt de cada imagen es
  lo que lee el lector de pantalla.
-->
<div data-orbit-logos="" data-orbit-speed="1">
  <div data-orbit-stage="">
    <div data-orbit-center=""><img src="/logos/atom-mark.svg" alt="Atom" /></div>
    <ul data-orbit-ring="inner">
      <li data-orbit-item="" data-orbit-label="HubSpot"><img src="/logos/hubspot.svg" alt="HubSpot" /></li>
      <li data-orbit-item="" data-orbit-label="Salesforce"><img src="/logos/salesforce.svg" alt="Salesforce" /></li>
      <li data-orbit-item="" data-orbit-label="Meta"><img src="/logos/meta.svg" alt="Meta" /></li>
    </ul>
    <ul data-orbit-ring="outer">
      <li data-orbit-item="" data-orbit-label="Zoho"><img src="/logos/zoho.svg" alt="Zoho" /></li>
      <li data-orbit-item="" data-orbit-label="Freshdesk"><img src="/logos/freshdesk.svg" alt="Freshdesk" /></li>
      <li data-orbit-item="" data-orbit-label="Google"><img src="/logos/google.svg" alt="Google" /></li>
      <li data-orbit-item="" data-orbit-label="Talkdesk"><img src="/logos/talkdesk.svg" alt="Talkdesk" /></li>
    </ul>
  </div>
  <button type="button" class="marquee__toggle" data-orbit-toggle="" aria-label="Pausar animacion"></button>
</div>
