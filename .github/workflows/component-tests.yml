name: component-tests

on:
  pull_request:
    paths:
      - 'packages/components-react/**'
      - '.github/workflows/component-tests.yml'
  push:
    branches: [main]
    paths:
      - 'packages/components-react/**'

concurrency:
  group: component-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Vitest P0 components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atom-uikit/components-react test
      - name: Coverage (informational)
        run: pnpm --filter @atom-uikit/components-react exec vitest run --coverage || true
