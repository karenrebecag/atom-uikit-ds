# Conformance suite: el contrato ejecutable del DS (conformance/*.json).
# Corre en TODO PR y en push a main: es rápido (solo node builtins, sin install) y cubre lo que
# los demás gates no ven — leyes de escala, contrato de CSS/layouts, espejo del
# registry, budgets del index. Los budgets de dist se saltan aquí (sin build);
# los verifica el workflow de public-dist, que sí construye.
name: Conformance

on:
  pull_request:
  # También en push a main: deploy-public-dist se dispara ahí, así que sin esto un
  # push directo puede publicar el canal sin haber verificado ningún contrato.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Contract suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/conformance.mjs
      # La logica de los gates tambien se verifica: 95 tests con fixtures sinteticas
      # que corren con node puro, sin install. Sin esto el contrato vigila el repo
      # pero nada vigila que los checks sigan siendo correctos.
      - run: node --test "scripts/**/*.test.mjs"
